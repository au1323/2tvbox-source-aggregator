name = "2tvbox-source-aggregator"
main = "src/cf-entry.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# 自定义域名（可选，推荐配置）
# 取消注释并替换为你自己的域名和 Zone ID
 # routes = [
  #  { pattern = "catvod.mmvideo.dpdns.org/*", zone_id = "caf21713f153414c706e68d1913b244a" }
 # ]

[triggers]
crons = ["10 */12 * * *"]  # 每小时触发，实际执行频率由 Admin 设置的聚合间隔控制

[[kv_namespaces]]
binding = "KV"
id = "c23270fbb685449b87b0d36f746d8040"
preview_id = "7540cd3574b045d2a283efb1e3c80474"

[vars]
SPEED_TIMEOUT_MS = "5000"   # 源地址延迟阈值（毫秒）
SITE_TIMEOUT_MS = "3000"    # 站点 API 延迟阈值（毫秒）
FETCH_TIMEOUT_MS = "5000"   # 抓取配置 JSON 超时（毫秒）
WORKER_BASE_URL = "https://catvod.mmpic.cloudns.be"  # CF 边缘代理依赖此配置（JAR/MacCMS/直播源代理）
